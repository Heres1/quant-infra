# cargo-deny 配置（EN-01/EN-07）：供应链审计 + 许可证白名单 + 依赖黑名单
# CI 中 `cargo deny check` 调用；规则变更走 CONSTRAINTS §9 约束变更流程。

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 常见宽松许可证白名单；引入新依赖若许可证不在列，CI 红 → 评审后加白名单并留记录
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
